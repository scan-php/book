name: "CodeQL ASP.NET 4.7 Security Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Run security analysis every Monday at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  analyze:
    name: Analyze ASP.NET 4.7 Codebase
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Setup .NET Framework 4.7 Environment
      run: |
        # Install .NET Framework 4.7 targeting pack
        sudo apt-get update
        sudo apt-get install -y mono-complete
        # Set up ASP.NET 4.7 specific environment
        export ASPNETCORE_ENVIRONMENT=Development
        export DOTNET_TARGET_FRAMEWORK=net47
        echo "ASP.NET 4.7 Environment configured"
        echo "Target Framework: .NET Framework 4.0.30319"
        echo "ASP.NET Version: 4.7.3062.0"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        upload-logs: true

    - name: Generate ASP.NET 4.7 Security Report
      run: |
        # Create custom report for ASP.NET 4.7 findings
        echo "## ASP.NET 4.7 Security Analysis Report" > aspnet47-security-report.md
        echo "Generated on: $(date)" >> aspnet47-security-report.md
        echo "Target Framework: .NET Framework 4.0.30319" >> aspnet47-security-report.md
        echo "ASP.NET Version: 4.7.3062.0" >> aspnet47-security-report.md
        echo "" >> aspnet47-security-report.md
        echo "### Version-Specific Considerations:" >> aspnet47-security-report.md
        echo "- ASP.NET 4.7 has enhanced XSS protection" >> aspnet47-security-report.md
        echo "- Request validation is more robust" >> aspnet47-security-report.md
        echo "- Session management improvements" >> aspnet47-security-report.md
        echo "- Enhanced SQL injection protection" >> aspnet47-security-report.md
        echo "" >> aspnet47-security-report.md
        echo "### Analysis Configuration:" >> aspnet47-security-report.md
        echo "- Using standard CodeQL security queries" >> aspnet47-security-report.md
        echo "- Focused on ASP.NET files (.aspx, .aspx.cs, .master)" >> aspnet47-security-report.md
        echo "- Enhanced data flow and taint tracking enabled" >> aspnet47-security-report.md

    - name: Upload Security Report
      uses: actions/upload-artifact@v3
      with:
        name: aspnet47-security-report
        path: aspnet47-security-report.md 
