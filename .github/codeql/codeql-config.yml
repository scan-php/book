name: "ASP.NET 4.7 Security Configuration"

# Use comprehensive CodeQL queries for ASP.NET 4.7
queries:
  # Use standard security queries
  - uses: security-extended
  - uses: security-and-quality
  # Add additional query suites for better coverage
  - uses: security-experimental
  - uses: csharp-security-and-quality.qls

# Paths to exclude from analysis
paths-ignore:
  - "**/bin/**"
  - "**/obj/**"
  - "**/packages/**"
  - "**/node_modules/**"
  - "**/*.tmp"
  - "**/*.log"
  - "**/Temporary ASP.NET Files/**"
  - "**/ve-*.tmp"

# Paths to include (focus on ASP.NET files)
paths:
  - "**/*.aspx"
  - "**/*.aspx.cs"
  - "**/*.master"
  - "**/*.master.cs"
  - "**/*.config"
  - "**/*.cs"

# Query filters for ASP.NET 4.7 - be more inclusive
query-filters:
  - include:
      tags contain: csharp
  - include:
      tags contain: security
  - include:
      tags contain: asp.net
  # Only exclude very low precision queries
  - exclude:
      precision: very-low

# Analysis settings for ASP.NET 4.7
analysis:
  # Enable data flow analysis
  data-flow: true
  # Enable taint tracking
  taint-tracking: true
  # Enable inter-procedural analysis
  inter-procedural: true
  # Enable cross-file analysis
  cross-file: true
  # Set timeout for complex queries
  timeout: 600
  # Memory limit for analysis
  memory: 16384

# Output configuration
output:
  # Generate SARIF format
  format: sarif-latest
  # Include source code snippets
  include-source: true
  # Include data flow paths
  include-data-flow: true
  # Include taint flow paths
  include-taint-flow: true 
